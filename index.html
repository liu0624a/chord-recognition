<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Playable piano, guitar and ukulele with live chord recognition and staff notation" />
    <title>Chord Recognition</title>
    <script>
      // Apply the saved theme (or the OS preference) before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('chord-app-settings-v1');
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
